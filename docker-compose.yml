services:

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUD_FLARE_TUNNEL_TOKEN:?set CLOUD_FLARE_TUNNEL_TOKEN in .env}
    restart: unless-stopped
    networks:
      - tunnel
    depends_on:
      - auth-proxy

  # nginx: authenticates every request via oauth2-proxy, then forwards it to
  # the service selected by config/hosts.conf.
  auth-proxy:
    build: ./proxy
    init: true
    restart: unless-stopped
    volumes:
      - ./config:/config:ro
    networks:
      - tunnel
      - auth-internal
      - services
    depends_on:
      - oauth2-proxy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: entra-id
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID in .env}/v2.0
      OAUTH2_PROXY_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET in .env}
      OAUTH2_PROXY_REDIRECT_URL: https://${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: ${COOKIE_DOMAIN:?set COOKIE_DOMAIN in .env}
      # Domains the post-login redirect (rd) may point to. Listing the value both
      # with and without a leading dot makes this work whichever way COOKIE_DOMAIN
      # is written; a rejected rd silently falls back to "/" on the auth domain.
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${COOKIE_DOMAIN},.${COOKIE_DOMAIN}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks:
      - auth-internal

networks:
  # cloudflared <-> auth-proxy
  tunnel:
  # auth-proxy <-> oauth2-proxy
  auth-internal:
  # Shared with the protected services; other compose projects join it as an
  # external network named "home-services".
  services:
    name: home-services
