# Maps incoming domains to services on the "home-services" Docker network.
#
# Format: one mapping per line, whitespace separated:
#
#   <domain>  <container-name>[:<port>]
#
#   - <domain> is matched against the Host header. A leading "*." matches any
#     subdomain, e.g. "*.apps.example.com". Exact names win over wildcards.
#   - <container-name> is the service/container name reachable on the network.
#   - <port> defaults to 80.
#   - "#" starts a comment. Blank lines are ignored.
#
# This file is mounted read-only; changes are picked up within ~5 seconds
# without restarting anything. Invalid edits are logged and ignored.
#
# Domains must be subdomains of COOKIE_DOMAIN (see .env) so the single
# sign-on cookie is valid on all of them.

hello.example.com   hello-world:80
