worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    # Docker's embedded DNS. Using variables in proxy_pass together with this
    # resolver means nginx starts even when a backend is down and picks up
    # container IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Only cloudflared (on the private tunnel network) talks to us, so trust
    # the client IP header that Cloudflare sets.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    large_client_header_buffers 4 16k;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # domain -> upstream, generated from /config/hosts.conf by the entrypoint.
    # Unknown hosts fall through to the internal 404 server below, so they are
    # only revealed as unknown after authentication.
    map $host $upstream {
        hostnames;
        default 127.0.0.1:8081;
        include /etc/nginx/generated/hosts.map;
    }

    server {
        listen 80 default_server;

        set $oauth2 oauth2-proxy:4180;

        # oauth2-proxy endpoints (sign in, callback, sign out, ...) on every host.
        location /oauth2/ {
            proxy_pass http://$oauth2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
        }

        # Subrequest used by auth_request: 2xx = authenticated, 401 = not.
        location = /_auth {
            internal;
            proxy_pass http://$oauth2/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
        }

        location / {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;
            # Session cookie refreshes issued by oauth2-proxy.
            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie;

            error_page 401 = @signin;

            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # Identity of the authenticated user (client-supplied values are overwritten).
            proxy_set_header X-Auth-Request-User $auth_user;
            proxy_set_header X-Auth-Request-Email $auth_email;
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Email $auth_email;
            # WebSocket support.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location @signin {
            return 302 /oauth2/start?rd=$forwarded_proto://$host$request_uri;
        }
    }

    # Target for authenticated requests to domains missing from hosts.conf.
    server {
        listen 127.0.0.1:8081;
        return 404 "Unknown host\n";
    }
}
